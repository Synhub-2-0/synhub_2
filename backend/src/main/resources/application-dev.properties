# Perfil de desarrollo local: SPRING_PROFILES_ACTIVE=dev ./mvnw spring-boot:run
# Valores solo para una base y un JWT locales. Nunca usar este perfil en un entorno desplegado.
spring.datasource.password=${DATABASE_PASSWORD:admin}
authorization.jwt.secret=${JWT_SECRET:ThisIsASecretKeyForJWTWithAtLeast32CharactersAndMore}
# El front de `ng serve` corre en otro puerto.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
