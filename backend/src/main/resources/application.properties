spring.application.name=synhub_backend

# Spring Data Source Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
# Sin valor por defecto: se inyecta por entorno (perfil dev: ver application-dev.properties).
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA (AUDIT ARC-04)
# El esquema lo crea y lo cambia Flyway (db/migration); Hibernate solo comprueba que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
# Sin Open Session In View: las asociaciones se cargan dentro de los servicios (query services de solo lectura).
spring.jpa.open-in-view=false
# El SQL no va a los logs (el perfil dev lo activa).
spring.jpa.show-sql=false

# Spring Data JPA Hibernate Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=com.hub.synhub_backend.shared.domain.model.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# JWT Configuration Properties
# Obligatorio: la app no arranca sin JWT_SECRET (>= 32 bytes). En AWS se inyecta desde SSM;
# en desarrollo, el perfil dev define un valor local (application-dev.properties).
authorization.jwt.secret=${JWT_SECRET}
# Sesión (HUM-04): el JWT viaja en una cookie HttpOnly que dura lo mismo que el token.
authorization.jwt.expiration.days = 1
# Secure=true salvo en HTTP local (perfil dev o AUTH_COOKIE_SECURE=false en compose).
authorization.cookie.secure=${AUTH_COOKIE_SECURE:true}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# AUDIT PERF-01: las asociaciones lazy y las colecciones se cargan en lotes (una consulta por cada 100 entidades),
# no una por entidad.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# AI (Amazon Bedrock) - credenciales vía cadena por defecto de AWS
ai.bedrock.region=${AWS_REGION:us-east-1}
ai.bedrock.model-id=${BEDROCK_MODEL_ID:us.anthropic.claude-haiku-4-5-20251001-v1:0}
# Health check para el ALB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Cada cuánto se buscan tareas vencidas (AUDIT BUG-09).
app.tasks.expiration-check-ms=${TASKS_EXPIRATION_CHECK_MS:60000}

# CORS (AUDIT SEC-08): orígenes separados por comas. Vacío = solo mismo origen (nginx o CloudFront).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Swagger/OpenAPI apagado por defecto; el perfil dev lo enciende (AUDIT SEC-08).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
