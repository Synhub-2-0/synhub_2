spring.application.name=synhub_backend

# Spring Data Source Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=true

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Spring Data JPA Hibernate Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=com.hub.synhub_backend.shared.domain.model.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# JWT Configuration Properties
# En producción se inyecta JWT_SECRET (SSM); el valor por defecto es solo para desarrollo local.
authorization.jwt.secret = ${JWT_SECRET:ThisIsASecretKeyForJWTWithAtLeast32CharactersAndMore}
authorization.jwt.expiration.days = 7

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# AI (Amazon Bedrock) - credenciales vía cadena por defecto de AWS
ai.bedrock.region=${AWS_REGION:us-east-1}
ai.bedrock.model-id=${BEDROCK_MODEL_ID:us.anthropic.claude-haiku-4-5-20251001-v1:0}
# Health check para el ALB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
