<section class="mx-auto flex max-w-xl flex-col items-center rounded-3xl border border-dashed border-slate-300 bg-white px-8 py-14 text-center shadow-sm">
  <div class="grid h-16 w-16 place-items-center rounded-2xl bg-slate-100 text-slate-600">
    <mat-icon class="text-3xl">group_add</mat-icon>
  </div>
  <h2 class="mt-5 text-xl font-semibold tracking-tight text-slate-900">Todavía no perteneces a un grupo</h2>
  <p class="mt-2 max-w-sm text-sm leading-6 text-slate-500">
    Solicita el código de invitación al líder de tu equipo para unirte a un espacio de trabajo.
  </p>
  <button type="button" (click)="joinRequested.emit()"
    class="mt-6 inline-flex items-center gap-2 rounded-xl bg-[#0f172a] px-5 py-3 text-sm font-semibold text-white shadow-sm transition-all duration-150 hover:bg-slate-800">
    <mat-icon class="text-lg">group_add</mat-icon>
    Unirme a un grupo
  </button>
</section>
