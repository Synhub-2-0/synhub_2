<div class="pointer-events-none fixed right-4 top-4 z-50 flex w-[calc(100%-2rem)] max-w-sm flex-col gap-3" aria-live="polite">
  @for (toast of toastStore.toasts(); track toast.id) {
    <div role="alert"
      class="pointer-events-auto flex items-start gap-3 rounded-2xl border bg-white p-4 shadow-lg"
      [class]="toast.type === 'error' ? 'border-red-200' : toast.type === 'success' ? 'border-emerald-200' : 'border-slate-200'">
      <div class="grid h-9 w-9 shrink-0 place-items-center rounded-xl"
        [class]="toast.type === 'error' ? 'bg-red-50 text-red-600' : toast.type === 'success' ? 'bg-emerald-50 text-emerald-600' : 'bg-blue-50 text-[#4A90E2]'">
        <mat-icon>{{ toast.type === 'error' ? 'error_outline' : toast.type === 'success' ? 'check_circle' : 'info' }}</mat-icon>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-[10px] font-bold uppercase tracking-widest"
          [class]="toast.type === 'error' ? 'text-red-600' : toast.type === 'success' ? 'text-emerald-600' : 'text-[#4A90E2]'">
          {{ toast.type === 'error' ? 'Error' : toast.type === 'success' ? 'Listo' : 'Información' }}
        </p>
        <p class="mt-0.5 text-sm font-medium leading-snug text-slate-700">{{ toast.message }}</p>
      </div>
      <button type="button" (click)="toastStore.dismiss(toast.id)" class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-700">
        <mat-icon class="scale-75">close</mat-icon>
      </button>
    </div>
  }
</div>
