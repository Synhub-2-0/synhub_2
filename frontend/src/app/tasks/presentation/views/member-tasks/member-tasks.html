<div class="w-full h-full p-4 lg:p-8 bg-[#f8fafc] min-h-screen">
  <div class="max-w-7xl mx-auto flex flex-col gap-6">
    <div>
      <h1 class="text-2xl lg:text-3xl font-extrabold text-slate-800">Mis Tareas Asignadas</h1>
      <p class="text-sm text-slate-500 mt-1">Consulta tus entregas pendientes y actualiza el estado de tu progreso.</p>
    </div>
    @if (groupsStore.groups().length > 1) {
      <div class="flex items-center gap-2 overflow-x-auto pb-1">
        @for (group of groupsStore.groups(); track group.id) {
          <button type="button" (click)="selectGroup(group.id)"
            [class]="selectedGroupId() === group.id ? 'bg-[#1A4E85] text-white font-bold px-4 py-2 rounded-xl text-xs shadow-sm transition cursor-pointer' : 'bg-white text-slate-600 hover:bg-slate-100 px-4 py-2 rounded-xl text-xs border border-slate-200 transition cursor-pointer'">
            {{ group.name }}
          </button>
        }
      </div>
    }
    <div class="flex items-center gap-2 overflow-x-auto pb-1">
      @for (s of statusOptions; track s) {
        <button type="button" (click)="setFilter(s)"
          [class]="tasksStore.statusFilter() === s ? 'bg-[#4A90E2] text-white font-bold px-4 py-2 rounded-xl text-xs shadow-sm transition cursor-pointer shrink-0' : 'bg-white text-slate-600 hover:bg-slate-100 px-4 py-2 rounded-xl text-xs border border-slate-200 transition cursor-pointer shrink-0'">
          {{ labelFor(s) }}
        </button>
      }
    </div>
    @if (tasksStore.loading()) {
      <div class="py-16 flex flex-col items-center justify-center gap-3">
        <mat-icon fontIcon="cached" class="animate-spin text-4xl text-[#4A90E2]"></mat-icon>
        <span class="text-sm text-slate-500 font-medium">Cargando tus tareas...</span>
      </div>
    } @else {
      <app-task-list [tasks]="tasksStore.filteredTasks()" [isLeader]="false" (changeStatus)="onChangeStatus($event)">
      </app-task-list>
    }
  </div>
</div>
