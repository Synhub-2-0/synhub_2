<div class="mx-auto flex max-w-2xl flex-col gap-8 p-6 lg:p-10">
  <header class="rounded-3xl border border-slate-200/80 bg-white p-8 shadow-sm">
    <span class="text-xs font-bold uppercase tracking-widest text-[#4A90E2]">Gestión de Tareas</span>
    <h1 class="mt-1 text-2xl font-extrabold text-slate-900">{{ isEditMode ? 'Editar Tarea' : 'Crear Nueva Tarea' }}</h1>
    <p class="mt-1 text-sm text-slate-500">Completa los detalles de la actividad y asígnala a un integrante del equipo.</p>
  </header>

  <form (ngSubmit)="save()" class="flex flex-col gap-5 rounded-3xl border border-slate-200/80 bg-white p-8 shadow-sm">
    @if (!isEditMode && groupsStore.leaderGroups().length > 1) {
      <div>
        <label class="mb-1.5 block text-xs font-bold uppercase tracking-widest text-slate-400">Grupo</label>
        <select name="groupId" [ngModel]="groupId" (ngModelChange)="onGroupChange($any($event))"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800 outline-none focus:border-[#4A90E2]">
          @for (group of groupsStore.leaderGroups(); track group.id) { <option [ngValue]="group.id">{{ group.name }}</option> }
        </select>
      </div>
    }
    <div>
      <label class="mb-1.5 block text-xs font-bold uppercase tracking-widest text-slate-400">Título de la tarea</label>
      <input type="text" name="title" [(ngModel)]="title" required placeholder="Ej: Implementar integración de endpoints"
        class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800 outline-none focus:border-[#4A90E2]" />
    </div>
    <div>
      <label class="mb-1.5 block text-xs font-bold uppercase tracking-widest text-slate-400">Descripción</label>
      <textarea name="description" [(ngModel)]="description" rows="4" placeholder="Describe los entregables y criterios..."
        class="w-full resize-y rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800 outline-none focus:border-[#4A90E2]"></textarea>
    </div>
    <div>
      <label class="mb-1.5 block text-xs font-bold uppercase tracking-widest text-slate-400">Asignar a integrante</label>
      <select name="userId" [(ngModel)]="userId" required
        class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800 outline-none focus:border-[#4A90E2]">
        <option [ngValue]="null" disabled>Selecciona un integrante del grupo</option>
        @for (entry of members(); track entry.user.id) {
          <option [ngValue]="entry.user.id">
            {{ entry.user.name }} {{ entry.user.surname }} (&#64;{{ entry.user.username }}){{ entry.roleInGroup === 'GROUP_LEADER' ? ' · Líder' : '' }}
          </option>
        }
      </select>
    </div>
    <div>
      <label class="mb-1.5 block text-xs font-bold uppercase tracking-widest text-slate-400">Fecha y hora de entrega</label>
      <input type="datetime-local" name="dueDateTime" [(ngModel)]="dueDateTime" required
        class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800 outline-none focus:border-[#4A90E2]" />
    </div>
    <div class="mt-2 grid grid-cols-2 gap-3 border-t pt-5">
      <button type="button" (click)="cancel()"
        class="rounded-xl bg-slate-100 px-4 py-2.5 text-center text-xs font-bold text-slate-700 transition-colors hover:bg-slate-200">
        Cancelar
      </button>
      <button type="submit" [disabled]="!title.trim() || !dueDateTime || !userId || tasksStore.loading()"
        class="rounded-xl bg-[#4A90E2] px-4 py-2.5 text-center text-xs font-bold text-white transition-colors hover:bg-blue-600 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-[#4A90E2]">
        {{ isEditMode ? 'Guardar Cambios' : 'Crear Tarea' }}
      </button>
    </div>
  </form>
</div>
