<div class="w-full h-full p-4 lg:p-8 bg-[#f8fafc] min-h-screen">
  <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-sm border border-gray-200 p-6 lg:p-8">
    <h1 class="text-2xl font-extrabold text-slate-800 mb-1">{{ isEditMode ? 'Editar Tarea' : 'Crear Nueva Tarea' }}</h1>
    <p class="text-xs text-slate-500 mb-6">Completa los detalles de la actividad y asígnala a un miembro del equipo.</p>
    <form (ngSubmit)="save()" class="flex flex-col gap-5">
      @if (!isEditMode && groupsStore.groups().length > 1) {
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Grupo</label>
          <select name="groupId" [ngModel]="groupId" (ngModelChange)="onGroupChange($event)"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-800 outline-none focus:border-[#4A90E2]">
            @for (group of groupsStore.groups(); track group.id) { <option [ngValue]="group.id">{{ group.name }}</option> }
          </select>
        </div>
      }
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Título de la tarea</label>
        <input type="text" name="title" [(ngModel)]="title" required placeholder="Ej: Implementar integración de endpoints"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-800 outline-none focus:border-[#4A90E2]" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Descripción</label>
        <textarea name="description" [(ngModel)]="description" rows="4" placeholder="Describe los entregables y criterios..."
          class="w-full resize-y rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-800 outline-none focus:border-[#4A90E2]"></textarea>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Asignar a integrante</label>
        <select name="userId" [(ngModel)]="userId" required
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-800 outline-none focus:border-[#4A90E2]">
          <option [ngValue]="null" disabled>Selecciona un integrante del grupo</option>
          @for (member of members(); track member.id) {
            <option [ngValue]="member.id">{{ member.name }} {{ member.surname }} (&#64;{{ member.username }})</option>
          }
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Fecha y hora de entrega</label>
        <input type="datetime-local" name="dueDateTime" [(ngModel)]="dueDateTime" required
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-800 outline-none focus:border-[#4A90E2]" />
      </div>
      <div class="mt-4 flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
        <button type="button" (click)="cancel()" class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-50 transition cursor-pointer">Cancelar</button>
        <button type="submit" [disabled]="!title.trim() || !dueDateTime || !userId || tasksStore.loading()"
          class="rounded-xl bg-[#4A90E2] hover:bg-[#357abd] px-6 py-2.5 text-sm font-bold text-white shadow-sm transition cursor-pointer disabled:opacity-50">
          {{ isEditMode ? 'Guardar Cambios' : 'Crear Tarea' }}
        </button>
      </div>
    </form>
  </div>
</div>
