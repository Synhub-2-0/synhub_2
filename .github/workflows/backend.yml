name: Backend
# Un solo workflow (AUDIT OPS-01): el deploy depende del job de tests, así un commit en rojo no llega a AWS.
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  id-token: write   # OIDC hacia AWS, sin claves guardadas
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: synhub-backend
  CLUSTER: synhub
  SERVICE: synhub-backend

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: backend/pom.xml }
      # Las pruebas de integración levantan PostgreSQL con Testcontainers (el runner ya trae Docker).
      - run: ./mvnw -B verify
      # El jar probado es el mismo que se despliega.
      - uses: actions/upload-artifact@v4
        with: { name: backend-jar, path: backend/target/*.jar, if-no-files-found: error }

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with: { name: backend-jar, path: backend/target }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}

      # La infraestructura se enciende/apaga a demanda: si el servicio no existe, solo queda la imagen lista.
      - name: Redeploy si el servicio está encendido
        run: |
          status=$(aws ecs describe-services --cluster $CLUSTER --services $SERVICE --query 'services[0].status' --output text 2>/dev/null || true)
          if [ "$status" = "ACTIVE" ]; then
            aws ecs update-service --cluster $CLUSTER --service $SERVICE --force-new-deployment >/dev/null
            aws ecs wait services-stable --cluster $CLUSTER --services $SERVICE
          else
            echo "Servicio apagado: imagen publicada, se usará en el próximo 'make up'."
          fi
